<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VU Shuttle — Daily Schedule</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="phone">
  <div class="statusbar">
    <span id="clock">9:41</span>
    <span class="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span>
  </div>

  <div class="topbar" style="align-items:center;">
    <button class="iconbtn" onclick="window.location.href='home.html'" aria-label="Back to home">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M15 19l-7-7 7-7" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="topbar-text">
      <p class="brand">VU Shuttle</p>
      <p class="page-title">Daily Schedule</p>
    </div>
  </div>

  <div class="content">
    <p style="font-size:13px; color:var(--slate); margin:0;">Two buses run each day. Choose one to see its full stop-by-stop timetable.</p>

    <a class="trip-option" href="schedule-timetable.html?trip=morning">
      <span class="tic">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="4.5" stroke="#1B4B66" stroke-width="1.8"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1" stroke="#1B4B66" stroke-width="1.8" stroke-linecap="round"/></svg>
      </span>
      <div class="ttext">
        <p class="ttitle">Morning Bus &middot; 8:00 AM</p>
        <p class="tsub">Karjat Station &rarr; VU Campus</p>
      </div>
      <span class="tchev"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M9 5l7 7-7 7" stroke="#667085" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    </a>

    <a class="trip-option" href="schedule-timetable.html?trip=evening">
      <span class="tic">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 3v9" stroke="#1B4B66" stroke-width="1.8" stroke-linecap="round"/><path d="M7 9l5 5 5-5" stroke="#1B4B66" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 19h16M6 19a6 6 0 0 1 12 0" stroke="#1B4B66" stroke-width="1.8" stroke-linecap="round"/></svg>
      </span>
      <div class="ttext">
        <p class="ttitle">Evening Bus &middot; 5:00 PM</p>
        <p class="tsub">VU Campus &rarr; Karjat Station</p>
      </div>
      <span class="tchev"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M9 5l7 7-7 7" stroke="#667085" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    </a>

    <p style="font-size:12px; color:var(--slate); margin:0;">Runs daily, including weekends.</p>
  </div>
</div>
<script src="app.js"></script>
<script>initLiveClock('clock');</script>
</body>
</html>
