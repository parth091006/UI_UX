<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VU Shuttle — Live Map</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="phone">
  <div class="statusbar">
    <span id="clock">9:41</span>
    <span class="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span>
  </div>
  <div class="topbar" style="align-items:center;">
    <button class="iconbtn" onclick="window.location.href='home.html'" aria-label="Back to home">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M15 19l-7-7 7-7" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="topbar-text">
      <p class="brand">VU Shuttle</p>
      <p class="page-title">Live Map</p>
    </div>
  </div>

  <div class="content">
    <div class="map-panel">
      <svg viewBox="0 0 360 300" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
        <defs><linearGradient id="terrain" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#E4E8DC"/><stop offset="100%" stop-color="#F4F5F1"/></linearGradient></defs>
        <rect width="360" height="300" fill="url(#terrain)"/>
        <path d="M250 0 C 270 40, 300 20, 320 55 C 335 78, 355 60, 360 90 L 360 0 Z" fill="#D7DCC6"/>
        <path d="M0 230 C 25 220, 35 245, 55 238 C 70 233, 78 250, 60 262 L 0 262 Z" fill="#D7E4EA"/>
        <path id="route" d="M40,200 L340,110" fill="none" stroke="#1B4B66" stroke-width="3.5" stroke-dasharray="1.5 7" stroke-linecap="round"/>
        <g id="stops"></g>
        <text x="40" y="220" font-size="9" fill="#4A4C46" text-anchor="middle" font-family="sans-serif">Karjat Station</text>
        <text x="332" y="98" font-size="9" fill="#4A4C46" text-anchor="end" font-family="sans-serif">VU Campus</text>
        <g transform="translate(332,24)"><path d="M0 -12 L5 4 L0 0 L-5 4 Z" fill="#4A4C46"/><text x="0" y="16" font-size="9" fill="#4A4C46" text-anchor="middle" font-family="sans-serif">N</text></g>
        <g transform="translate(20,278)">
          <line x1="0" y1="0" x2="100" y2="0" stroke="#4A4C46" stroke-width="1.4"/>
          <line x1="0" y1="-3" x2="0" y2="3" stroke="#4A4C46" stroke-width="1.4"/>
          <line x1="100" y1="-3" x2="100" y2="3" stroke="#4A4C46" stroke-width="1.4"/>
          <text x="0" y="14" font-size="8" fill="#4A4C46" font-family="sans-serif">0</text>
          <text x="86" y="14" font-size="8" fill="#4A4C46" font-family="sans-serif">10 km</text>
        </g>
        <g id="bus" transform="translate(40,200)">
          <circle r="12" fill="#E8A33D"/>
          <path d="M-5 -3.5h10a1.5 1.5 0 0 1 1.5 1.5v4a1.5 1.5 0 0 1-1.5 1.5h-10A1.5 1.5 0 0 1 -6.5 2v-4A1.5 1.5 0 0 1 -5 -3.5Z" fill="#241a03"/>
          <circle cx="-3" cy="3.6" r="1.1" fill="#241a03"/><circle cx="3" cy="3.6" r="1.1" fill="#241a03"/>
        </g>
      </svg>
    </div>
    <p id="dir" style="font-size:12px; color:var(--slate); margin:0 2px;"></p>

    <div class="eta-card">
      <div>
        <p class="label" id="eta-label">Next arrival</p>
        <p class="value" id="eta">--</p>
      </div>
      <div class="bus-badge">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M4 16V8a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2Z" stroke="#fff" stroke-width="1.8"/><path d="M4 12h16" stroke="#fff" stroke-width="1.8"/><circle cx="8" cy="18.5" r="1.4" fill="#fff"/><circle cx="16" cy="18.5" r="1.4" fill="#fff"/></svg>
      </div>
    </div>

    <div class="notice-card">
      <h3 id="trip-name">Route</h3>
      <div class="rt-list" id="route-list"></div>
    </div>
  </div>
</div>
<script src="app.js"></script>
<script>initLiveClock('clock'); initLiveMap();</script>
</body>
</html>
